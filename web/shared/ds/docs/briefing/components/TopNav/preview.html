<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap">
<style>
  body{margin:0;background:var(--ground);font-family:var(--font-label)}
  .nav{display:flex;align-items:center;gap:var(--space-6);padding:0 var(--space-6);height:48px;
    background:var(--ground);box-shadow:inset 0 -1px 0 var(--panel-edge)}
  .mark{display:flex;align-items:center;gap:var(--space-2);color:var(--gold);font:600 13px/16px var(--font-label);letter-spacing:.18em;text-transform:uppercase;text-decoration:none}
  .mark b{color:var(--glyph-cross);font-style:italic}
  .links{display:flex;gap:var(--space-1);list-style:none;margin:0;padding:0;flex:1}
  .links a{display:block;padding:6px 10px;color:var(--text);font:500 13px/16px var(--font-label);letter-spacing:.18em;text-transform:uppercase;text-decoration:none}
  .links a:hover,.links a[aria-current="page"]{background:var(--tab-lit);color:var(--gold)}
  .links a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .classic{padding:6px 12px;color:var(--text);background:var(--tab);box-shadow:var(--panel-inset);font:500 13px/16px var(--font-label);letter-spacing:.18em;text-transform:uppercase;text-decoration:none}
  .classic:hover{background:var(--tab-lit);color:var(--gold)}
</style>
