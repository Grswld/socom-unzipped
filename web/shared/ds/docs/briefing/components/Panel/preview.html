<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap">
<style>
  body{margin:0;background:var(--ground);padding:24px;font-family:var(--font-body)}
  .panel{max-width:560px;display:flex;flex-direction:column;gap:var(--space-2)}
  .panel-head{background:var(--panel);box-shadow:var(--panel-inset);color:var(--gold);
    font:600 17px/24px var(--font-label);letter-spacing:.1em;text-transform:uppercase;padding:var(--space-3) var(--space-4)}
  .panel-body{background:var(--panel);box-shadow:var(--panel-inset);color:var(--text);
    font:400 19px/26px var(--font-body);padding:var(--space-4)}
  .panel-body p{margin:0}
  .caret{display:inline-block;width:.55em;height:1em;background:var(--caret);vertical-align:-.15em;margin-left:.15em}
</style>
<section class="panel">
  <h2 class="panel-head">Seeding Chaos mission overview</h2>
  <div class="panel-body">
    <p>US Special Operations Command has been called upon to assist in quelling the illegal arms trafficking of an organization known as the Sesseri Syndicate.<span class="caret" aria-hidden="true"></span></p>
  </div>
</section>
