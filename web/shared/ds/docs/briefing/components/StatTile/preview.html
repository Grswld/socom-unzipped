<!-- @dsCard group="Site" height=150 subtitle="Figure with caption, in a row" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap">
<style>
  body{margin:0;background:var(--ground);padding:24px;font-family:var(--font-label)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);max-width:620px;list-style:none;margin:0;padding:0}
  .stat{background:var(--panel);box-shadow:var(--panel-inset);padding:var(--space-4) var(--space-4) var(--space-3)}
  .stat b{display:block;color:var(--gold);font:600 26px/28px var(--font-label)}
  .stat span{display:block;margin-top:2px;color:var(--text-dim);font:500 11px/14px var(--font-label);letter-spacing:.16em;text-transform:uppercase}
</style>
<ul class="stats">
  <li class="stat"><b>59</b><span>Entries</span></li>
  <li class="stat"><b>300</b><span>Commits cited</span></li>
  <li class="stat"><b>7</b><span>Eras</span></li>
  <li class="stat"><b>Sep 25</b><span>Latest</span></li>
</ul>
