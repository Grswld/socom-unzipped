# REPORT A BUG: nginx's own brake in front of the inbox (the inbox also limits per caller per hour).
limit_req_zone $binary_remote_addr zone=s2u_bugs:1m rate=12r/m;

# SERVER STATS: a two-second micro-cache in front of the game server's stats endpoint, so any number of
# open pages cost the Medius process one request every two seconds.
proxy_cache_path /var/cache/nginx/s2u_stats levels=1 keys_zone=s2u_stats:1m max_size=2m inactive=1m;

# The site's own domain since 2026-09-27 is socomunzipped.com. The old name s2u.scotho.com and the www form send
# page requests there with a 301, but /api/ (shipped launchers post bug reports to the old name) keeps answering
# on every hostname, so nothing already in the field breaks. Both names reach this one server block through the
# claudescape tunnel; the map decides per request.
map "$host$uri" $s2u_redirect {
    default 0;
    "~^(s2u\.scotho\.com|www\.socomunzipped\.com)/(api)/" 0;
    "~^(s2u\.scotho\.com|www\.socomunzipped\.com)/" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($s2u_redirect) { return 301 https://socomunzipped.com$request_uri; }
    # Plain-http visitors (Cloudflare passes the visitor's scheme) go to https on the canonical name.
    if ($http_x_forwarded_proto = "http") { return 301 https://socomunzipped.com$request_uri; }

    # Unknown paths are real 404s (they used to fall through to index.html, a soft 404 to a crawler).
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache"; }
    location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /media/  { add_header Cache-Control "public, max-age=604800"; }
    location /sfx/    { add_header Cache-Control "public, max-age=604800"; }
    location /img/    { add_header Cache-Control "public, max-age=604800"; }
    location /fonts/  { add_header Cache-Control "public, max-age=604800"; }  # the names are not hashed
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /classic.html { add_header Cache-Control "no-cache"; }
    location = /story.html { add_header Cache-Control "no-cache"; }
    location = /data.html { add_header Cache-Control "no-cache"; }
    location = /ds/index.html { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex" always; }
    # The web page was /web.html for an evening (2026-09-20); links to it still land on the root, fragment kept.
    location = /web.html { return 301 /; }
    # The hosted Horizon server's live stats (Medius StatsServer on the game box, firewalled to this box).
    # The browser cannot ask it directly: the page is https and the box speaks plain http on a closed port.
    location = /api/stats {
        proxy_pass http://3.143.65.100:10080/stats;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 4s;
        proxy_cache s2u_stats;
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
        proxy_intercept_errors on;
        error_page 502 503 504 = @stats_offline;
    }
    location @stats_offline {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"offline"}';
    }

    # The bug-report inbox (web/landing/api). POST only, small bodies, the caller's address from Cloudflare.
    # Docker's resolver + a variable: nginx starts (and the site stays up) even when s2u-api is down.
    location = /api/bugs {
        limit_except POST { deny all; }
        client_max_body_size 128k;
        limit_req zone=s2u_bugs burst=6 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        set $s2u_api http://s2u-api:8080;
        proxy_pass $s2u_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # The play-tester list (same service, same shape as the inbox: POST only, a small body, rate limited).
    location = /api/testers {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        limit_req zone=s2u_bugs burst=6 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        set $s2u_api http://s2u-api:8080;
        proxy_pass $s2u_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # redotcom, the map viewer (web/redotcom in socom_pc, built for /redotcom/ and shipped in the image). Its maps are
    # the owner's extracted archives, mounted from the host rather than baked into the image.
    location = /redotcom { return 301 /redotcom/; }
    location /redotcom/maps/ {
        alias /srv/redotcom/maps/;
        types { application/octet-stream ZDB; application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
    }
    location /redotcom/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /redotcom/index.html { add_header Cache-Control "no-cache"; }
    location /redotcom/ { try_files $uri $uri/ /redotcom/index.html; }
    # It was /map-viewer/ until 2026-09-29 (the owner renamed it redotcom everywhere): every old link, deep or not,
    # lands on the same path under /redotcom/ with its query string kept (?map=MP2 and the rest).
    location ~ ^/map-viewer(?:/(.*))?$ {
        absolute_redirect off;
        return 301 /redotcom/$1$is_args$args;
    }

    location / { try_files $uri $uri/ =404; }
}
