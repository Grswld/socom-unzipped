# Sprint 10 hardening (the repository went public on 2026-09-20): the leak check on every push and every pull
# request, over the tree, the full history, the commit identities and the ignored paths -- and gitleaks beside
# it as a second, independent opinion. This job is cheap (minutes) and runs on documentation-only changes too,
# because a secret in a document is still a secret. It is a required check on `main`.
#
# Exit codes are three-state: 0 clean, 1 findings, 2 the scanner did not run. A 2 fails the job; it is never a
# pass. The report is uploaded with its excerpts masked, so the artifact can be read without re-leaking the hit.
name: secrets

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leakcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the history and ignored-path modes refuse a shallow clone (exit 2)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: The leak check's own tests (the planted controls)
        run: python -m unittest tools_py.tests.test_leakcheck -v

      # `all`'s sixth leg calls ../scotho's and ../socom_monitor's scanners. Neither repository is on a runner,
      # so both report SKIPPED -- "did not run", printed as such and never as clean -- and the job stays green.
      # `--require` turns a missing sibling into exit 2 and belongs only where the siblings exist; not here.
      - name: The leak check -- tree, ignored paths, commit identities, full history, the siblings
        run: |
          mkdir -p logs/ci
          python -m tools_py.release.leakcheck all --json logs/ci/leakcheck.json

      - name: gitleaks, pinned by checksum, over the full history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --log-opts=--all --redact --verbose --exit-code 1 --report-format json --report-path logs/ci/gitleaks.json .

      - name: Upload the reports (excerpts masked)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leakcheck-reports
          path: logs/ci/
          if-no-files-found: warn
