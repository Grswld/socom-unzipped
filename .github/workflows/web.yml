name: web
# The web half on its own -- one npm workspace at web/: redotcom (the map viewer and its local demo), the landing site
# (socomunzipped.com) and the design system they share. Typecheck, the unit suites (the fixture-backed tests skip
# without game data) and both builds. The landing site's story is generated from docs/STORY.md and docs/story by
# tools_py/story at build and test time, so those paths trigger it too; the recomp's workflow is linux.yml.
on:
  push:
    paths: ['web/**', 'docs/STORY.md', 'docs/story/**', 'tools_py/story/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'docs/STORY.md', 'docs/story/**', 'tools_py/story/**', '.github/workflows/web.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
