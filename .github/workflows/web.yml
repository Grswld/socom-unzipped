name: web
# The browser map viewer under web/, on its own: typecheck, the unit suite (the fixture-backed tests
# skip without game data) and a build. Runs only when web/ changes; the recomp's workflow is linux.yml.
on:
  push:
    paths: ['web/**']
  pull_request:
    paths: ['web/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
