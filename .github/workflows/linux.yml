# Sprint 8 Goal 1, design item 6(a): the first verification ring for the Linux client.
# Configure and build ps2_runtime, ps2x_tests and the launcher WITHOUT the generated game code (14,882
# files produced from the owner's disc, not in the repository), then run the suite.
#
# Sprint 13 C1: the same job then links the runner against a synthetic generated set (tests/fixtures/synthetic_recomp,
# three hand-written functions), so the files only the runner compiles -- game_overrides_socom2.cpp, socom2_crypto.cpp --
# compile on every code push (scripts/build_synthetic_runner.sh).
#
# What green means: the library, the two suites and the launcher build and pass without the game. It proves
# nothing about the game -- only the three-stage gate on a rebuilt exe does that (docs/HANDOFF.md §4 rule 4).
#
# Sprint 10 hardening: a cheap first job decides whether anything outside docs/ changed, and the hour-long build
# is skipped when not -- a skipped `build` satisfies the required check, which is what lets `build` be required on
# `main` without blocking documentation-only pull requests.
#
# Sprint 13 H1 -- how to read a run. GitHub makes a run `success` when any job passed and `skipped` only when every
# job was skipped, so while `changes` always ran, a docs-only push read `success` with nothing built. Now:
#   push, docs/ only   -> no `linux` run at all (`on.push.paths-ignore`); `secrets` and `docs` run on that commit.
#   push, anything else -> `changes` says "code changed", `build` runs; `success` means built and tested.
#   pull_request       -> always runs (a required check must report); `changes` compares the pull request's
#                         base.sha...head.sha (merge base), so a PR carrying code builds whatever its last push was. A docs-only
#                         PR reads `success` with `build` skipped -- the one case where green did not build.
# tools_py/tests/test_workflows.py pins all of this.
name: linux

on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  # false: a documentation-only push right behind a code push must not cancel the hour-long build that push
  # started (it did, 2026-09-21). Since Sprint 13 H1 a docs-only push starts no run here at all; this stays false
  # for a docs-only pull_request synchronize, whose ten-second run would otherwise still cancel.
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did anything outside docs/ change?
        id: diff
        env:
          # pull_request: base...head (three dots: from the merge base, so main moving since the fork is not "code changed";
          # the whole branch, not its last push); push: before...after (the same as two dots unless the push was forced).
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "$EVENT: comparing $BASE...$HEAD (from their merge base)"
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$zero" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ($BASE): building"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git merge-base "$BASE" "$HEAD" >/dev/null 2>&1; then
            echo "no merge base for $BASE and $HEAD: building"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A failing diff fails the step (set -e on the assignment); it can never read as "docs/ only".
          files=$(git diff --name-only "$BASE...$HEAD")
          changed=$(echo "$files" | grep -v -e '^docs/' -e '^$' || true)
          if [ -n "$changed" ]; then
            echo "code changed:"; echo "$changed" | head -50; echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs/ only: the build job is skipped (its required check reads skipped; this run reads success)"; echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sprint 13 C6, review round 1: NOT pinned by version. A -dev package depends on its runtime package at exactly
      # the same version, and the runner image upgrades the runtime packages on its own, so a pin here turns into a
      # downgrade conflict at the next image refresh or security update -- and the release tarball is built in the
      # socom-linux VM, not here. What the green run 36136392705 (2026-09-25) installed, for the record:
      #   build-essential 12.10ubuntu1, clang/lld 1:18.0-59~exp2, cmake 3.28.3-1build7, ninja-build 1.11.1-2,
      #   libgl1-mesa-dev 25.2.8-0ubuntu0.24.04.2, libglu1-mesa-dev 9.0.2-1.1build1, libx11-dev 2:1.8.7-1build1,
      #   libxrandr-dev 2:1.5.2-2build1, libxinerama-dev 2:1.1.4-3build1, libxcursor-dev 1:1.2.1-1build1,
      #   libxi-dev 2:1.8.1-1build1, libxext-dev 2:1.3.4-1build2, libwayland-dev 1.22.0-2.1build1,
      #   libxkbcommon-dev 1.6.0-1build1, libasound2-dev 1.2.11-1ubuntu0.3, libpulse-dev 1:16.1+dfsg1-2ubuntu10.1,
      #   the FFmpeg -dev family 7:6.1.1-3ubuntu5; image-owned: pkg-config, python3, python3-pip.
      # The next step prints the FFmpeg family's installed versions into the log, so a run says what it built against.
      # apt-unpinned (reviewed): the whole install line below
      - name: Install the toolchain and the client's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libavfilter-dev libavdevice-dev \
            python3 python3-pip

      - name: The FFmpeg family's installed versions (what this run built against)
        run: dpkg-query -W 'libavcodec*' 'libavformat*' 'libavutil*' 'libswscale*' 'libswresample*' 'libavfilter*' 'libavdevice*' || true

      # What the Python tooling imports beyond the standard library, pinned: requirements.txt (the Windows-only
      # rows carry a sys_platform marker). tools_py/tests/test_requirements.py holds this line and the file to the tree.
      - name: Install the Python packages the suite imports
        run: python3 -m pip install --break-system-packages -r requirements.txt

      - name: Build (no generated code)
        id: build
        run: bash scripts/build_linux.sh --no-runner

      - name: Test
        run: |
          mkdir -p logs/ci
          set -o pipefail
          # --no-runner here too: without it this step reconfigures with
          # PS2X_RUNNER_GENERATED_DIR pointing at recomp/output, which CI does not have, and
          # the build step above is undone and redone on every job.
          bash scripts/build_linux.sh test --no-runner 2>&1 | tee logs/ci/build_linux_test.log

      # Sprint 13 C1: the files only the runner compiles, and the runner's link, against a hand-written synthetic
      # generated set (tests/fixtures/synthetic_recomp) -- without it CMake skips the runner and nothing here ever
      # compiled them. In the tree the build step made, so only the runner's own sources compile. After the suite, so
      # both verdicts print; not after a failed build, which would only fail again.
      - name: Compile game_overrides_socom2.cpp and socom2_crypto.cpp and link the runner (synthetic generated set)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash scripts/build_synthetic_runner.sh --build-dir third_party/ps2recomp/build-linux

      - name: Upload the launcher
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: socom-unzipped-launcher-linux
          path: dist-linux/socom_unzipped_launcher
          if-no-files-found: error

      - name: Upload the test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-test-output
          path: logs/ci/build_linux_test.log
          if-no-files-found: warn

  # Sprint 14 Task E3: the recompiler re-derives a synthetic ELF on every code push. tests/fixtures/recomp_ref holds
  # the inputs (make_fixture.py writes them: ps2xTest's Sprint 12 3b ELF, a two-row function map, a one-row names
  # sidecar, a toml) and expected/, the output ps2_recomp built from the tree wrote for them. Any codegen drift --
  # intended or not -- fails here with the diff printed; an intended one regenerates expected/ in the same commit
  # (docs/DEVELOPING.md "Recompiler reference"). Not a required check. tools_py/tests/test_workflows.py pins it.
  recomp-ref:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # apt-unpinned (reviewed): the install line below, for the build job's reason above (the image upgrades the
      # runtime packages on its own); the recompiler needs only the compiler, CMake and Ninja.
      - name: Install the toolchain the recompiler needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang lld cmake ninja-build

      # The configuration Sprint 12's plan (row 1a) proved on Linux: the recompiler alone, no runtime, analyzer or tests.
      - name: Build ps2_recomp (nothing else)
        run: |
          set -euo pipefail
          cmake -S third_party/ps2recomp -B "$RUNNER_TEMP/build-recomp" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DPS2X_BUILD_RUNTIME=OFF -DPS2X_BUILD_ANALYZER=OFF -DPS2X_BUILD_TEST=OFF
          cmake --build "$RUNNER_TEMP/build-recomp" --target ps2_recomp -j "$(nproc)"

      # ps2_recomp resolves the toml's paths against the current directory, so it runs in a copy of the fixture
      # (output = "out/"), never in the checkout.
      - name: Recompile the fixture and diff the reference
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/recomp_ref"
          rm -rf "$work"
          cp -r tests/fixtures/recomp_ref "$work"
          rm -rf "$work/expected"
          cd "$work"
          "$RUNNER_TEMP/build-recomp/ps2xRecomp/ps2_recomp" recomp_ref.toml
          if ! diff -r out "$GITHUB_WORKSPACE/tests/fixtures/recomp_ref/expected"; then
            echo "::error::the recompiler's output drifted from tests/fixtures/recomp_ref/expected (the diff is above);"\
              "an intended codegen change regenerates it -- docs/DEVELOPING.md \"Recompiler reference\""
            exit 1
          fi
          echo "recomp-ref: $(ls out | wc -l) files, identical to expected/"
